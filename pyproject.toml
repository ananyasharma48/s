[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-cell-proteomics-mil"
version = "0.1.0"
description = "Leakage-aware multi-instance learning for single-cell proteomics"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pyarrow>=15,<20",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "torchmetrics>=1.3,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "pyteomics>=4.6,<5",
  "pymzml>=2.5,<3",
  "h5py>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["src*"]
